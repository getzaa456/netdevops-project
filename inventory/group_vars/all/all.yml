# ---- Connection settings (ใช้ร่วมทุกอุปกรณ์ Cisco) ----
ansible_network_os: cisco.ios.ios
ansible_connection: ansible.netcommon.network_cli
ansible_user: admin
ansible_password: "{{ vault_ssh_password }}"
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ vault_enable_password }}"

# IOSv รุ่นเก่าใช้ ssh-rsa — เพิ่มบรรทัดนี้กัน SSH ต่อไม่ติดบน Ubuntu ใหม่ ๆ
ansible_ssh_common_args: >-
  -o KexAlgorithms=+diffie-hellman-group14-sha1
  -o HostKeyAlgorithms=+ssh-rsa
  -o PubkeyAcceptedAlgorithms=+ssh-rsa
  -o MACs=+hmac-sha1,hmac-sha1-96
  -o PreferredAuthentications=password,keyboard-interactive

domain_name: lab.local
dns_server: 8.8.8.8

vlans:
  - { id: 10, name: IT,          subnet: 10.10.10.0/24, gateway: 10.10.10.1 }
  - { id: 20, name: HR,          subnet: 10.10.20.0/24, gateway: 10.10.20.1 }
  - { id: 30, name: SALES,       subnet: 10.10.30.0/24, gateway: 10.10.30.1 }
  - { id: 40, name: MARKETING,   subnet: 10.10.40.0/24, gateway: 10.10.40.1 }
  - { id: 99, name: SERVER-MGMT, subnet: 10.10.99.0/24, gateway: 10.10.99.1 }
