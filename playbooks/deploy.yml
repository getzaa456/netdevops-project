- name: Deploy switch configurations
  hosts: switches
  connection: network_cli
  gather_facts: false
  vars_files:
    - "../group_vars/all/all.yml"
    - "../group_vars/all/vault.yml"
  roles:
    - vlan
    - routing
    - dhcp
    - acl

- name: Deploy router configurations
  hosts: routers
  connection: network_cli
  gather_facts: false
  vars_files:
    - "../group_vars/all/all.yml"
    - "../group_vars/all/vault.yml"
  roles:
    - routing
    - nat

- name: Save configurations
  hosts: all
  connection: network_cli
  gather_facts: false
  vars_files:
    - "../group_vars/all/all.yml"
    - "../group_vars/all/vault.yml"
  tasks:
    - name: Save running-config to startup-config
      cisco.ios.ios_config:
        save_when: modified