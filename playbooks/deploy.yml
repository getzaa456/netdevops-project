---
- name: Configure switching infrastructure
  hosts: switches
  gather_facts: false
  roles:
    - role: vlan
    - role: routing
    - role: dhcp
    - role: acl
    - role: snmp

- name: Configure edge routing
  hosts: routers
  gather_facts: false
  roles:
    - role: routing
    - role: nat
    - role: snmp

- name: Save device configurations
  hosts: all
  gather_facts: false
  tasks:
    - name: Save running configuration when modified
      cisco.ios.ios_config:
        save_when: modified
