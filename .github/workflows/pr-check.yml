name: PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'network-config.xlsx'
      - 'tools/**'
      - 'inventory/**'
      - 'roles/**'
      - 'playbooks/**'
      - 'ansible.cfg'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate-excel:
    name: Validate Excel and generated YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install generator dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify Excel source exists
        run: |
          test -f network-config.xlsx || {
            echo "ERROR: network-config.xlsx is missing from the repository root."
            exit 1
          }

      - name: Validate Excel configuration
        run: python tools/generate_inventory.py --check

      - name: Generate Ansible inventory from Excel
        run: python tools/generate_inventory.py

      - name: Show generated inventory diff
        run: git diff -- inventory/ || true

      - name: Install Ansible linters
        run: python -m pip install yamllint ansible-lint

      - name: Run yamllint
        run: yamllint inventory playbooks roles

      - name: Run ansible-lint
        run: ansible-lint playbooks/deploy.yml

  dry-run:
    name: Ansible dry-run
    needs: validate-excel
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Excel source exists
        shell: bash
        run: |
          test -f network-config.xlsx || {
            echo "ERROR: network-config.xlsx is missing from the repository root."
            exit 1
          }

      - name: Create Python virtual environment
        shell: bash
        run: |
          rm -rf .venv
          python3 -m venv .venv

      - name: Install Excel generator dependencies
        shell: bash
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/requirements.txt

      - name: Validate and generate inventory
        shell: bash
        run: |
          .venv/bin/python tools/generate_inventory.py --check
          .venv/bin/python tools/generate_inventory.py

      - name: Create Ansible Vault password file
        shell: bash
        run: |
          printf '%s' "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Ansible syntax check
        shell: bash
        run: ansible-playbook playbooks/deploy.yml --syntax-check

      - name: Ansible check mode
        shell: bash
        run: ansible-playbook playbooks/deploy.yml --check --diff
