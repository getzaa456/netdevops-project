name: Deploy Network Config

on:
  push:
    branches:
      - main
    paths:
      - 'network-config.xlsx'
      - 'tools/**'
      - 'inventory/**'
      - 'roles/**'
      - 'playbooks/**'
      - 'ansible.cfg'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: network-production
  cancel-in-progress: false

jobs:
  validate-generate-deploy:
    name: Validate, generate and deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Excel source exists
        shell: bash
        run: |
          test -f network-config.xlsx || {
            echo "ERROR: network-config.xlsx is missing from the repository root."
            exit 1
          }

      - name: Create Python virtual environment
        shell: bash
        run: |
          rm -rf .venv
          python3 -m venv .venv

      - name: Install Excel generator dependencies
        shell: bash
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/requirements.txt

      - name: Validate Excel configuration
        shell: bash
        run: .venv/bin/python tools/generate_inventory.py --check

      - name: Generate Ansible inventory from Excel
        shell: bash
        run: .venv/bin/python tools/generate_inventory.py

      - name: Show generated configuration changes
        shell: bash
        run: git diff -- inventory/ || true

      - name: Create Ansible Vault password file
        shell: bash
        run: |
          printf '%s' "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Syntax check
        shell: bash
        run: ansible-playbook playbooks/deploy.yml --syntax-check

      - name: Deploy configuration
        shell: bash
        run: ansible-playbook playbooks/deploy.yml

      - name: Verify network state
        shell: bash
        run: ansible-playbook playbooks/verify.yml

      - name: Backup device configurations
        shell: bash
        run: ansible-playbook playbooks/backup.yml

      - name: Commit updated backups
        shell: bash
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add backups/

          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-backup running configs [skip ci]"
          git push
