# SVI = gateway
create_svis: true

# DHCP
dhcp_excluded:
  - { start: 10.10.10.1, end: 10.10.10.10 }
  - { start: 10.10.20.1, end: 10.10.20.10 }
  - { start: 10.10.30.1, end: 10.10.30.10 }

dhcp_pools:
  - { name: VLAN10, network: 10.10.10.0, mask: 255.255.255.0, gateway: 10.10.10.1 }
  - { name: VLAN20, network: 10.10.20.0, mask: 255.255.255.0, gateway: 10.10.20.1 }
  - { name: VLAN30, network: 10.10.30.0, mask: 255.255.255.0, gateway: 10.10.30.1 }

# Static routes
static_routes:
  - { prefix: 0.0.0.0, mask: 0.0.0.0, next_hop: 10.10.254.1 }

# ACL policy
acls:
  - name: BLOCK-HR-TO-SERVER
    rules:
      - deny ip 10.10.20.0 0.0.0.255 10.10.99.0 0.0.0.255
      - permit ip any any
    apply_to: Vlan20
    direction: in

# Trunks
trunk_interfaces:
  - { name: GigabitEthernet0/1, allowed_vlans: "10,20,99" }
  - { name: GigabitEthernet0/2, allowed_vlans: "30,99" }
