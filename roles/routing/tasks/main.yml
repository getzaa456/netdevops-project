---
- name: Remove SVIs for VLANs deleted from Excel
  cisco.ios.ios_config:
    lines:
      - "no interface Vlan{{ item }}"
  loop: "{{ stale_vlan_ids | default([]) }}"
  loop_control:
    label: "Vlan{{ item }}"
  when: create_svis | default(false)

- name: Create SVIs for enabled VLANs
  cisco.ios.ios_config:
    lines:
      - "ip address {{ item.gateway }} {{ item.subnet | ansible.utils.ipaddr('netmask') }}"
      - no shutdown
    parents: "interface Vlan{{ item.id }}"
  loop: "{{ vlans | default([]) }}"
  loop_control:
    label: "VLAN {{ item.id }} - {{ item.name }}"
  when:
    - create_svis | default(false)
    - item.create_svi | default(true)

- name: Enable IP routing on Layer 3 switches
  cisco.ios.ios_config:
    lines:
      - ip routing
  when: create_svis | default(false)

- name: Configure static routes
  cisco.ios.ios_config:
    lines:
      - "ip route {{ item.prefix }} {{ item.mask }} {{ item.next_hop }}"
  loop: "{{ static_routes | default([]) }}"
  loop_control:
    label: "{{ item.prefix }}/{{ item.mask }} via {{ item.next_hop }}"
