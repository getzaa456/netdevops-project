---
- name: Create SVIs for each VLAN (core only)
  cisco.ios.ios_config:
    lines:
      - ip address {{ item.gateway }} {{ item.subnet | ansible.utils.ipaddr('netmask') }}
      - no shutdown
    parents: interface Vlan{{ item.id }}
  loop: "{{ vlans }}"
  when: create_svis | default(false)

- name: Enable IP routing (core only)
  cisco.ios.ios_config:
    lines:
      - ip routing
  when: create_svis | default(false)

- name: Configure static routes
  cisco.ios.ios_config:
    lines:
      - ip route {{ item.prefix }} {{ item.mask }} {{ item.next_hop }}
  loop: "{{ static_routes | default([]) }}"
