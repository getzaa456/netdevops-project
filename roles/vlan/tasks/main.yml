---
- name: Build VLAN config list
  ansible.builtin.set_fact:
    _vlan_config: "{{ _vlan_config | default([]) + [{'vlan_id': item.id, 'name': item.name}] }}"
  loop: "{{ vlans | default([]) }}"

- name: Create VLANs
  cisco.ios.ios_vlans:
    config: "{{ _vlan_config }}"
    state: merged

- name: Configure trunk interfaces
  cisco.ios.ios_config:
    lines:
      - switchport trunk encapsulation dot1q
      - switchport mode trunk
      - switchport trunk allowed vlan {{ item.allowed_vlans }}
    parents: interface {{ item.name }}
  loop: "{{ trunk_interfaces | default([]) }}"

- name: Configure access interfaces
  cisco.ios.ios_config:
    lines:
      - description {{ item.description }}
      - switchport mode access
      - switchport access vlan {{ item.vlan }}
    parents: interface {{ item.name }}
  loop: "{{ access_interfaces | default([]) }}"
